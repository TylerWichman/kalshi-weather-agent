const $ = (id) => document.getElementById(id);
const usd = (c, sign) => {
  const v = c / 100;
  const s = Math.abs(v).toLocaleString("en-US", { style: "currency", currency: "USD" });
  if (!sign) return (v < 0 ? "-" : "") + s;
  return (v > 0 ? "+" : v < 0 ? "-" : "±") + s;
};
const cents = (c) => (c == null ? "–" : c + "¢");
const ET = "America/New_York";      // every time on the page is Eastern (EDT/EST)
const fmtTime = (ts) => new Date(ts * 1000).toLocaleString("en-US",
  { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: ET }) + " ET";
const fmtDay = (d) => new Date(d + "T12:00:00Z").toLocaleDateString("en-US",
  { month: "short", day: "numeric", timeZone: "UTC" });
function setDelta(el, c, suffix) {
  el.className = "delta " + (c > 0 ? "up" : c < 0 ? "down" : "flat");
  el.textContent = (c > 0 ? "▲ " : c < 0 ? "▼ " : "") + usd(c, true) + (suffix || "");
}
function cell(tr, text, cls) {
  const td = document.createElement("td");
  td.textContent = text;
  if (cls) td.className = cls;
  tr.appendChild(td);
  return td;
}
function table(el, headers, rows, emptyText) {
  el.replaceChildren();
  if (!rows.length) {
    const tr = el.insertRow(); const td = tr.insertCell();
    td.colSpan = headers.length; td.className = "none"; td.style.textAlign = "left";
    td.textContent = emptyText; return;
  }
  const head = el.createTHead().insertRow();
  headers.forEach((h) => { const th = document.createElement("th"); th.textContent = h; head.appendChild(th); });
  const body = el.createTBody();
  rows.forEach((r) => { const tr = body.insertRow(); r(tr); });
}

function render() {
  const d = DATA;
  if (!d) { $("sub").textContent = "No data yet."; return; }
  document.title = d.title;
  $("title").textContent = d.title;
  const badge = document.createElement("span"); badge.className = "badge"; badge.textContent = "sandbox · not Gate 2";
  $("title").appendChild(badge);
  $("rule").textContent = d.rule;
  $("footer").replaceChildren(...d.footer.map((t, i) => { const p = document.createElement("p");
    if (i === 0) { const b = document.createElement("strong"); b.textContent = t; p.appendChild(b); } else p.textContent = t;
    return p; }));
  const now = Date.now() / 1000;
  const mins = Math.round((now - d.updated) / 60);
  $("sub").textContent = `Mock money · updated ${fmtTime(d.updated)}` +
    (mins > 1 ? ` (${mins} min ago)` : "");

  const pill = $("pill");
  const stale = mins > (d.stale_min || 25);
  const ok = d.health.ok && !stale;
  pill.querySelector(".dot").style.background = ok ? "var(--up)" : "var(--down)";
  pill.lastChild.textContent = ok ? "✓ Running OK" : "! Problem";
  const probs = [...d.health.problems];
  if (stale) probs.unshift(`This page has not been updated for ${mins} minutes.`);
  $("problems").replaceChildren(...probs.map((p) => {
    const li = document.createElement("li"); li.textContent = p; return li; }));

  const equity = d.cash + d.open;
  $("equity").textContent = usd(equity);
  setDelta($("equity-delta"), equity - d.start, ` since start (${usd(d.start)})`);

  const settled = d.trades.filter((t) => t.status !== "open");
  const won = settled.filter((t) => t.status === "won").length;
  const pnl = (t) => ((t.status === "won" ? 100 : t.status === "lost" ? 0 : (t.mark ?? t.price))
                      - t.price) * t.contracts - t.fee;
  const realized = settled.reduce((s, t) => s + pnl(t), 0);
  $("settled").textContent = `${won} won · ${settled.length - won} lost`;
  $("settled-sub").textContent = settled.length
    ? `${Math.round(100 * won / settled.length)}% won · ${usd(realized, true)} realized`
    : "None settled yet";

  const open = d.trades.filter((t) => t.status === "open");
  const atRisk = open.reduce((s, t) => s + t.price * t.contracts + t.fee, 0);
  $("open").textContent = open.length;
  $("open-sub").textContent = open.length ? `${usd(atRisk)} committed` : "No open positions";

  const dayN = Math.max(1, Math.floor((now - d.live.since) / 86400) + 1);
  $("progress").textContent = `Day ${dayN}`;
  $("progress-sub").textContent = `Since ${fmtTime(d.live.since)} · ${d.live.checks} check${d.live.checks === 1 ? "" : "s"} run`;

  drawChart(d);

  table($("open-table"), ["City", "Side", "Contracts", "Paid", "Now", "Unrealized", "Entered (check)"],
    open.slice().reverse().map((t) => (tr) => {
      cell(tr, t.city); cell(tr, t.side.toUpperCase()); cell(tr, t.contracts);
      cell(tr, cents(t.price)); cell(tr, cents(t.mark));
      const u = pnl(t); cell(tr, usd(u, true), u > 0 ? "up" : u < 0 ? "down" : "");
      cell(tr, fmtTime(t.entered));
    }), "No open positions. " + d.next_text);

  table($("settled-table"), ["Rain day", "City", "Side", "Contracts", "Paid", "Result", "Net P&L"],
    settled.slice().reverse().map((t) => (tr) => {
      cell(tr, fmtDay(t.day)); cell(tr, t.city); cell(tr, t.side.toUpperCase());
      cell(tr, t.contracts); cell(tr, cents(t.price));
      cell(tr, t.status === "won" ? "✓ Won" : "✕ Lost");
      const p = pnl(t); cell(tr, usd(p, true), p > 0 ? "up" : p < 0 ? "down" : "");
    }), "Nothing settled yet. Positions settle the morning after their rain day.");

  const label = { ok: "Checked", missed: "! Missed (run started too late)",
                  discarded: "! Discarded (fetch crossed the check time)" };
  const fmtCheck = (ts) => new Date(ts * 1000).toLocaleString("en-US", { month: "short",
    day: "numeric", hour: "numeric", minute: "2-digit", timeZone: ET }) + " ET";
  table($("days-table"), ["Check", "Rain day", "Status", "Markets", "Evaluated", "Trades"],
    d.checks.slice().reverse().map((x) => (tr) => {
      cell(tr, fmtCheck(x.ts));
      cell(tr, fmtDay(x.day));
      cell(tr, label[x.status] || x.status);
      cell(tr, x.markets ?? "–"); cell(tr, x.evals ?? "–"); cell(tr, x.trades ?? "–");
    }), d.next_text);

  $("refresh").textContent = d.note || "This page reloads itself every minute.";
}

function niceStep(range, target) {
  const raw = range / target, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
}

function drawChart(d) {
  const host = $("chart");
  host.replaceChildren();
  const pts = d.equity;
  if (pts.length < 2) {
    const e = document.createElement("div"); e.className = "empty";
    e.textContent = "The line starts once the account has been valued twice. " + d.next_text;
    host.appendChild(e); return;
  }
  const W = host.clientWidth, H = host.clientHeight;
  const m = { l: 64, r: 16, t: 12, b: 28 };
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  let lo = Math.min(d.start, ...pts.map((p) => p.v)), hi = Math.max(d.start, ...pts.map((p) => p.v));
  if (hi - lo < 2000) { const mid = (hi + lo) / 2; lo = mid - 1000; hi = mid + 1000; }
  const step = niceStep(hi - lo, 4);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = (t) => m.l + (W - m.l - m.r) * (t - t0) / Math.max(1, t1 - t0);
  const y = (v) => m.t + (H - m.t - m.b) * (1 - (v - lo) / (hi - lo));
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `Mock account value from ${fmtTime(t0)} to ${fmtTime(t1)}, now ${usd(pts[pts.length - 1].v)}`);
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; };

  for (let v = lo; v <= hi + 1; v += step) {
    el("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1 });
    const tx = el("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end", fill: "var(--muted)",
      "font-size": 12, style: "font-variant-numeric: tabular-nums" });
    tx.textContent = "$" + (v / 100).toLocaleString("en-US", { maximumFractionDigits: 0 });
  }
  // X ticks: the coarsest step that still gives at least two labels, at most ~6.
  const H1 = 3600, steps = [H1, 3 * H1, 6 * H1, 12 * H1, 24 * H1, 48 * H1, 168 * H1];
  const every = steps.find((s) => (t1 - t0) / s <= 6) || steps[steps.length - 1];
  const fmtTick = every < 24 * H1
    ? (t) => new Date(t * 1000).toLocaleTimeString("en-US", { hour: "numeric", timeZone: ET })
    : (t) => new Date(t * 1000).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: ET });
  const minGap = Math.max(40, (W - m.l - m.r) / 8);
  let lastX = -Infinity;
  for (let t = Math.ceil(t0 / every) * every; t <= t1; t += every) {
    if (x(t) - lastX < minGap) continue;
    lastX = x(t);
    const tx = el("text", { x: x(t), y: H - 8, "text-anchor": "middle", fill: "var(--muted)", "font-size": 12 });
    tx.textContent = fmtTick(t);
  }
  // Starting bankroll: the reference the line is read against.
  el("line", { x1: m.l, x2: W - m.r, y1: y(d.start), y2: y(d.start), stroke: "var(--axis)", "stroke-width": 1 });
  const sl = el("text", { x: W - m.r, y: y(d.start) - 6, "text-anchor": "end", fill: "var(--ink-2)", "font-size": 12 });
  sl.textContent = "Start " + usd(d.start);

  const line = pts.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(1) + "," + y(p.v).toFixed(1)).join("");
  el("path", { d: line + `L${x(t1)},${y(lo)}L${x(t0)},${y(lo)}Z`, fill: "var(--series)", "fill-opacity": 0.1 });
  el("path", { d: line, fill: "none", stroke: "var(--series)", "stroke-width": 2,
               "stroke-linejoin": "round", "stroke-linecap": "round" });
  const last = pts[pts.length - 1];
  el("circle", { cx: x(last.t), cy: y(last.v), r: 5, fill: "var(--series)", stroke: "var(--surface)", "stroke-width": 2 });

  const cross = el("line", { y1: m.t, y2: H - m.b, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });
  const dot = el("circle", { r: 5, fill: "var(--series)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" });
  host.appendChild(svg);
  const tip = document.createElement("div"); tip.className = "tip"; host.appendChild(tip);
  const val = document.createElement("b"); const when = document.createElement("div");
  when.style.color = "var(--ink-2)"; tip.append(val, when);

  function show(evt) {
    const r = svg.getBoundingClientRect();
    const px = (evt.clientX - r.left) * W / r.width;
    const tt = t0 + (px - m.l) / (W - m.l - m.r) * (t1 - t0);
    let best = pts[0];
    for (const p of pts) if (Math.abs(p.t - tt) < Math.abs(best.t - tt)) best = p;
    const cx = x(best.t), cy = y(best.v);
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", cx); dot.setAttribute("cy", cy); dot.setAttribute("visibility", "visible");
    val.textContent = usd(best.v); when.textContent = fmtTime(best.t);
    tip.style.display = "block";
    const left = cx * r.width / W;
    tip.style.left = Math.min(Math.max(0, left - tip.offsetWidth / 2), r.width - tip.offsetWidth) + "px";
    tip.style.top = Math.max(0, cy * r.height / H - tip.offsetHeight - 12) + "px";
  }
  function hide() { cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); tip.style.display = "none"; }
  svg.addEventListener("pointermove", show);
  svg.addEventListener("pointerleave", hide);
}

render();
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => DATA && drawChart(DATA), 150); });
// Every minute, and whenever the tab is looked at again (background tabs pause timers),
// fetch a fresh copy past the browser and CDN caches; switch to it only if it is newer.
let checking = false;
async function checkForUpdate() {
  if (checking || document.hidden) return;
  checking = true;
  try {
    const u = new URL(location.href); u.searchParams.set("t", Date.now());
    const r = await fetch(u, { cache: "no-store" });
    const m = r.ok && (await r.text()).match(/"updated":\s*(\d+)/);
    if (m && (!DATA || +m[1] > DATA.updated)) location.replace(u);
  } catch (e) { /* offline: keep showing what we have */ }
  checking = false;
}
setInterval(checkForUpdate, 60000);
document.addEventListener("visibilitychange", checkForUpdate);
window.addEventListener("pageshow", (e) => { if (e.persisted) checkForUpdate(); });
