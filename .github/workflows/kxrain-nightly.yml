name: KXRAIN nightly

# 20:07 UTC, backup 21:37. GitHub has started scheduled jobs over 2 hours late (09-25
# night: 23:29 started 01:45, a missed night), so the job starts about 4 hours early and
# waits inside itself for 23:51, 23:56 and 00:00:30 UTC. The repo is public, so the
# waiting costs no minutes. A backup that starts after the primary finished logs
# "already handled" and exits.
on:
  schedule:
    - cron: "7 20 * * *"
    - cron: "37 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dryrun = one snapshot now, no trade (plumbing check)"
        type: choice
        options: [dryrun, nightly]
        default: dryrun

permissions:
  contents: write

concurrency:
  group: kxrain-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 4 h of waiting if started on time; GitHub's cap is 360
    steps:
      - uses: actions/checkout@v4
      - name: Load state
        run: bash .github/scripts/load_state.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy
      - name: Run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m src.actions ${{ github.event_name == 'schedule' && 'nightly' || inputs.mode }}
      - name: Save state
        if: always()
        run: bash .github/scripts/save_state.sh nightly

# (Re-pushed 2026-09-24: files in a repository's creating push are not always registered.)
