name: Sandbox dashboard refresh (one arm)

# Called by sandbox-mark.yml only. Shares the arm's queue with its serve runs, so the two
# never write the arm's state branch at the same time.
on:
  workflow_call:
    inputs:
      arm:
        type: string
        required: true

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sandbox-${{ inputs.arm }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sandbox
      - name: Load state
        run: bash .github/scripts/sbx_load_state.sh sbx-state-${{ inputs.arm }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy
      - name: Mark
        run: python -m sandbox.live mark --arm ${{ inputs.arm }}
