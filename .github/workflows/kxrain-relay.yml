name: KXRAIN relay

# Primary trigger for Gate 2's nightly job (owner decision 2026-09-25, after two late cron starts). Fires at 19:15 UTC; the nightly then waits in-job for 23:51/23:56/00:00:30 UTC exactly as before. Its own crons (20:07, 21:37) remain as backup; a duplicate start logs "already handled".
# Timer only: it decides WHEN existing jobs start, never what they do. Each run sleeps
# until the next fire time below, dispatches that workflow (dispatched runs start within
# about a minute, unlike GitHub's cron), and before its ~5 h 20 min limit dispatches the
# next relay run, so the chain keeps itself going. The cron here only restarts the chain
# if it ever breaks; the target workflows keep their own crons as a further backup.
# Logic and tests: .github/scripts/relay.sh.
on:
  workflow_dispatch:
    inputs:
      after:
        description: "internal: last fire time already handled (epoch seconds)"
        default: "0"
  schedule:
    - cron: "41 */4 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: kxrain-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Relay
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AFTER: ${{ inputs.after || '0' }}
          RELAY_WORKFLOW: kxrain-relay.yml
          FIRES: |
            19:15 kxrain-nightly.yml mode=nightly
        run: bash .github/scripts/relay.sh
